<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Local Photo Gallery</title>
  
  <!-- Styling & Frameworks -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    /* Custom scrollbar and theme baseline */
    body { 
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif; 
      -webkit-tap-highlight-color: transparent;
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #090d16; }
    ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #334155; }
    
    .touch-action-none { touch-action: none; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 h-full overflow-hidden">
  <div id="root" class="h-full"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useCallback, useRef } = React;

    // Sample fallback data for demonstration when offline or server unavailable
    const MOCK_PHOTOS = Array.from({ length: 24 }).map((_, i) => ({
      id: i + 1,
      file_name: `Photo_${String(i + 1).padStart(3, '0')}.jpg`,
      file_path: `C:\\Users\\Gallery\\Pictures\\2026\\Photo_${String(i + 1).padStart(3, '0')}.jpg`,
      width: 3840,
      height: 2560,
      file_size: 4500000 + (i * 120000),
      camera_make: i % 2 === 0 ? 'Sony' : 'Canon',
      camera_model: i % 2 === 0 ? 'α7 IV' : 'EOS R6',
      date_taken: new Date(Date.now() - i * 86400000 * 3).toISOString(),
      urls: {
        thumbnail: `https://picsum.photos/id/${(i * 7 + 10) % 1000}/400/400`,
        original: `https://picsum.photos/id/${(i * 7 + 10) % 1000}/1600/1000`
      },
      tags: i % 3 === 0 
        ? [{ id: 1, name: 'Nature', category: 'general' }, { id: 2, name: 'Vacation', category: 'event' }]
        : i % 2 === 0 
        ? [{ id: 3, name: 'Portrait', category: 'person' }] 
        : [{ id: 4, name: 'Urban', category: 'location' }]
    }));

    const MOCK_TAGS = [
      { id: 1, name: 'Nature', category: 'general' },
      { id: 2, name: 'Vacation', category: 'event' },
      { id: 3, name: 'Portrait', category: 'person' },
      { id: 4, name: 'Urban', category: 'location' }
    ];

    function App() {
      // Helper to compute reliable server base URL
      const getDefaultServerUrl = () => {
        const saved = localStorage.getItem('lpg_server_url');
        if (saved && saved.trim() !== '') return saved.trim();
        if (window.location.protocol === 'file:') return 'http://localhost:8080';
        return (window.location.origin && window.location.origin !== 'null') 
          ? window.location.origin 
          : 'http://localhost:8080';
      };

      const [serverUrl, setServerUrl] = useState(getDefaultServerUrl);
      const [photos, setPhotos] = useState([]);
      const [tags, setTags] = useState([]);
      const [status, setStatus] = useState({
        total_photos: 0,
        total_tags: 0,
        db_size_bytes: 0,
        cache_size_bytes: 0,
        monitored_dirs: [],
        is_scanning: false
      });
      const [isCaching, setIsCaching] = useState(false);
      const [activeTab, setActiveTab] = useState('gallery'); // 'gallery' | 'settings'
      const [selectedTag, setSelectedTag] = useState('');
      const [searchQuery, setSearchQuery] = useState('');
      const [activePhotoIndex, setActivePhotoIndex] = useState(null);
      const [notification, setNotification] = useState(null);
      const [isMobileSidebarOpen, setIsMobileSidebarOpen] = useState(false);
      const [isDemoMode, setIsDemoMode] = useState(false);
      const [mobileTab, setMobileTab] = useState('preview'); // 'preview' | 'info' in lightbox
      const [isServerOnline, setIsServerOnline] = useState(false);

      // Pagination & Loading state
      const [page, setPage] = useState(1);
      const [pageSize, setPageSize] = useState(120);
      const [totalPhotosCount, setTotalPhotosCount] = useState(0);
      const [isLoading, setIsLoading] = useState(false);
      const [hasMore, setHasMore] = useState(true);

      // Server directory management state
      const [newDirectoryPath, setNewDirectoryPath] = useState('');
      const [newTagName, setNewTagName] = useState('');
      const [newTagCategory, setNewTagCategory] = useState('general');

      // Touch gesture support for Lightbox
      const touchStartX = useRef(null);
      const touchEndX = useRef(null);

      const getAssetUrl = useCallback((path) => {
        if (!path) return '';
        if (path.startsWith('http://') || path.startsWith('https://')) return path;
        
        let base = (serverUrl && serverUrl.trim() !== '') ? serverUrl.trim() : 'http://localhost:8080';
        base = base.replace(/\/+$/, '');
        const cleanPath = path.startsWith('/') ? path : '/' + path;
        return `${base}${cleanPath}`;
      }, [serverUrl]);

      const notify = (message, type = 'info') => {
        setNotification({ message, type });
        setTimeout(() => setNotification(null), 4000);
      };

      const fetchPhotos = async (pageNum = 1, append = false, currentLimit = pageSize) => {
        setIsLoading(true);
        try {
          const queryParams = new URLSearchParams({
            page: pageNum.toString(),
            limit: currentLimit.toString()
          });
          if (selectedTag) queryParams.append('tags', selectedTag);

          const endpoint = getAssetUrl(`/api/v1/photos?${queryParams.toString()}`);
          const res = await fetch(endpoint);
          if (!res.ok) throw new Error('Failed to fetch photos');
          
          const data = await res.json();
          const loadedPhotos = data.data || [];
          const total = data.total || 0;

          setTotalPhotosCount(total);
          
          if (append) {
            setPhotos(prev => [...prev, ...loadedPhotos]);
          } else {
            setPhotos(loadedPhotos);
          }

          const currentCount = append ? photos.length + loadedPhotos.length : loadedPhotos.length;
          setHasMore(currentCount < total && loadedPhotos.length > 0);
          setPage(pageNum);
          setIsDemoMode(false);
          setIsServerOnline(true);
        } catch (err) {
          // Fallback to interactive demo mode if offline or no backend running
          setIsServerOnline(false);
          if (photos.length === 0 || !isDemoMode) {
            setPhotos(MOCK_PHOTOS);
            setTags(MOCK_TAGS);
            setTotalPhotosCount(MOCK_PHOTOS.length);
            setHasMore(false);
            setIsDemoMode(true);
            notify(`Server unreachable. Loaded Demo Gallery mode.`, 'info');
          }
        } finally {
          setIsLoading(false);
        }
      };

      const handleLoadMore = () => {
        if (!isLoading && hasMore) {
          fetchPhotos(page + 1, true, pageSize);
        }
      };

      const fetchTags = async () => {
        try {
          const res = await fetch(getAssetUrl('/api/v1/tags'));
          if (res.ok) {
            const data = await res.json();
            setTags(data || []);
          }
        } catch (err) {
          if (isDemoMode) setTags(MOCK_TAGS);
        }
      };

      const fetchStatus = async () => {
        try {
          const res = await fetch(getAssetUrl('/api/v1/system/status'));
          if (res.ok) {
            const data = await res.json();
            setStatus(data);
            setIsServerOnline(true);
          } else {
            setIsServerOnline(false);
          }
        } catch (err) {
          setIsServerOnline(false);
          if (isDemoMode) {
            setStatus(prev => ({
              total_photos: MOCK_PHOTOS.length,
              total_tags: MOCK_TAGS.length,
              db_size_bytes: 110592,
              cache_size_bytes: 1100862,
              monitored_dirs: prev?.monitored_dirs?.length > 0 
                ? prev.monitored_dirs 
                : ['D:\\A. Moiz 2nd Birthday 2020\\part 1'],
              is_scanning: prev?.is_scanning || false
            }));
          }
        }
      };

      useEffect(() => {
        fetchPhotos(1, false, pageSize);
        fetchTags();
        fetchStatus();
      }, [serverUrl, selectedTag, pageSize]);

      useEffect(() => {
        localStorage.setItem('lpg_server_url', serverUrl);
      }, [serverUrl]);

      useEffect(() => {
        const handleKeyDown = (e) => {
          if (activePhotoIndex === null) return;
          if (e.key === 'ArrowLeft') {
            setActivePhotoIndex(prev => (prev > 0 ? prev - 1 : prev));
          } else if (e.key === 'ArrowRight') {
            setActivePhotoIndex(prev => (prev < filteredPhotos.length - 1 ? prev + 1 : prev));
          } else if (e.key === 'Escape') {
            setActivePhotoIndex(null);
          }
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [activePhotoIndex, photos]);

      const handleAddDirectory = async (e) => {
        e.preventDefault();
        if (!newDirectoryPath.trim()) return;

        if (isDemoMode) {
          setStatus(prev => ({
            ...prev,
            monitored_dirs: [...(prev?.monitored_dirs || []), newDirectoryPath.trim()]
          }));
          notify('Directory added (Demo Mode)', 'success');
          setNewDirectoryPath('');
          return;
        }

        try {
          const res = await fetch(getAssetUrl('/api/v1/system/directories'), {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ directory: newDirectoryPath.trim(), action: 'add' })
          });
          if (res.ok) {
            notify('Directory added and scan initiated!', 'success');
            setNewDirectoryPath('');
            fetchStatus();
            fetchPhotos(1, false, pageSize);
          } else {
            notify('Failed to add directory.', 'error');
          }
        } catch (err) {
          notify('Server communication error.', 'error');
        }
      };

      const handleRemoveDirectory = async (dirPath) => {
        if (isDemoMode) {
          setStatus(prev => ({
            ...prev,
            monitored_dirs: (prev?.monitored_dirs || []).filter(d => d !== dirPath)
          }));
          notify('Directory removed (Demo Mode)', 'info');
          return;
        }

        try {
          const res = await fetch(getAssetUrl('/api/v1/system/directories'), {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ directory: dirPath, action: 'remove' })
          });
          if (res.ok) {
            notify('Directory removed from scan list.', 'info');
            fetchStatus();
          }
        } catch (err) {
          notify('Server communication error.', 'error');
        }
      };

      const handleTriggerScan = async () => {
        setStatus(prev => ({ ...prev, is_scanning: true }));
        if (isDemoMode) {
          notify('Rescan initiated (Demo Mode simulation)', 'info');
          setTimeout(() => setStatus(prev => ({ ...prev, is_scanning: false })), 3500);
          return;
        }
        try {
          const res = await fetch(getAssetUrl('/api/v1/system/scan'), { method: 'POST' });
          if (res.ok) {
            notify('Background directory scan started...', 'info');
            fetchStatus();
            setTimeout(() => {
              fetchPhotos(1, false, pageSize);
              fetchStatus();
            }, 3000);
          }
        } catch (err) {
          notify('Failed to trigger scan.', 'error');
          setStatus(prev => ({ ...prev, is_scanning: false }));
        }
      };

      const handlePurgeCache = async () => {
        setIsCaching(true);
        if (isDemoMode) {
          notify('Thumbnail cache purged! (Demo Mode)', 'success');
          setTimeout(() => setIsCaching(false), 2500);
          return;
        }
        try {
          const res = await fetch(getAssetUrl('/api/v1/system/purge-cache'), { method: 'POST' });
          if (res.ok) {
            notify('Thumbnail cache purged successfully!', 'success');
            fetchStatus();
          }
        } catch (err) {
          notify('Failed to purge cache.', 'error');
        } finally {
          setTimeout(() => setIsCaching(false), 2000);
        }
      };

      // Compute derived current activity status directly from the API's is_scanning flag
      const currentActivity = status?.is_scanning ? 'SCANNING' : (isCaching ? 'CACHING' : 'IDLE');

      const handleCreateTag = async (e) => {
        e.preventDefault();
        if (!newTagName.trim()) return;

        if (isDemoMode) {
          const newTagObj = { id: Date.now(), name: newTagName.trim(), category: newTagCategory };
          setTags(prev => [...prev, newTagObj]);
          notify(`Tag "${newTagName.trim()}" created! (Demo)`, 'success');
          setNewTagName('');
          return;
        }

        try {
          const res = await fetch(getAssetUrl('/api/v1/tags'), {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name: newTagName.trim(), category: newTagCategory })
          });
          if (res.ok) {
            notify(`Tag "${newTagName.trim()}" created!`, 'success');
            setNewTagName('');
            fetchTags();
          }
        } catch (err) {
          notify('Failed to create tag.', 'error');
        }
      };

      const handleAttachTagToPhoto = async (photoId, tagId) => {
        const tagObj = tags.find(t => t.id === tagId);
        if (isDemoMode && tagObj) {
          setPhotos(prev => prev.map(p => {
            if (p.id === photoId) {
              const current = p.tags || [];
              if (current.some(t => t.id === tagId)) return p;
              return { ...p, tags: [...current, tagObj] };
            }
            return p;
          }));
          notify('Tag attached to photo (Demo)', 'success');
          return;
        }

        try {
          const res = await fetch(getAssetUrl(`/api/v1/photos/${photoId}/tags`), {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ tag_id: tagId })
          });
          if (res.ok) {
            notify('Tag attached to photo', 'success');
            fetchPhotos(page, false, pageSize);
          }
        } catch (err) {
          notify('Failed to attach tag', 'error');
        }
      };

      const handleDetachTagFromPhoto = async (photoId, tagId) => {
        if (isDemoMode) {
          setPhotos(prev => prev.map(p => {
            if (p.id === photoId) {
              return { ...p, tags: (p.tags || []).filter(t => t.id !== tagId) };
            }
            return p;
          }));
          notify('Tag detached from photo (Demo)', 'info');
          return;
        }

        try {
          const res = await fetch(getAssetUrl(`/api/v1/photos/${photoId}/tags/${tagId}`), {
            method: 'DELETE'
          });
          if (res.ok) {
            notify('Tag detached from photo', 'info');
            fetchPhotos(page, false, pageSize);
          }
        } catch (err) {
          notify('Failed to detach tag', 'error');
        }
      };

      const filteredPhotos = useMemo(() => {
        return photos.filter(photo => {
          if (selectedTag && !photo.tags?.some(t => t.name.toLowerCase() === selectedTag.toLowerCase())) {
            return false;
          }
          if (!searchQuery.trim()) return true;
          const query = searchQuery.toLowerCase();
          const matchesName = photo.file_name?.toLowerCase().includes(query);
          const matchesCamera = photo.camera_make?.toLowerCase().includes(query) || photo.camera_model?.toLowerCase().includes(query);
          const matchesTags = photo.tags?.some(t => t.name.toLowerCase().includes(query));
          return matchesName || matchesCamera || matchesTags;
        });
      }, [photos, searchQuery, selectedTag]);

      // Touch handlers for image swiping on mobile
      const handleTouchStart = (e) => {
        touchStartX.current = e.touches[0].clientX;
      };
      const handleTouchMove = (e) => {
        touchEndX.current = e.touches[0].clientX;
      };
      const handleTouchEnd = () => {
        if (!touchStartX.current || !touchEndX.current) return;
        const diffX = touchStartX.current - touchEndX.current;
        if (diffX > 50 && activePhotoIndex < filteredPhotos.length - 1) {
          setActivePhotoIndex(activePhotoIndex + 1);
        } else if (diffX < -50 && activePhotoIndex > 0) {
          setActivePhotoIndex(activePhotoIndex - 1);
        }
        touchStartX.current = null;
        touchEndX.current = null;
      };

      return (
        <div className="flex flex-col h-full overflow-hidden bg-slate-950 text-slate-100">
          
          {/* Notification Toast */}
          {notification && (
            <div className={`fixed top-4 right-4 left-4 sm:left-auto z-[60] px-4 py-3 rounded-xl shadow-2xl border text-sm flex items-center gap-3 transition-all animate-bounce ${
              notification.type === 'error' ? 'bg-rose-950/90 border-rose-800 text-rose-200' :
              notification.type === 'success' ? 'bg-emerald-950/90 border-emerald-800 text-emerald-200' :
              'bg-slate-900/90 border-slate-700 text-slate-200'
            }`}>
              <i className={`fas ${
                notification.type === 'error' ? 'fa-exclamation-circle' :
                notification.type === 'success' ? 'fa-check-circle' : 'fa-info-circle'
              }`}></i>
              <span className="truncate">{notification.message}</span>
            </div>
          )}

          {/* Top Header */}
          <header className="h-16 border-b border-slate-800 bg-slate-900/90 backdrop-blur px-4 sm:px-6 flex items-center justify-between flex-shrink-0 z-20">
            <div className="flex items-center gap-3">
              <div className="w-9 h-9 sm:w-10 sm:h-10 rounded-xl bg-indigo-600 flex items-center justify-center text-white shadow-lg shadow-indigo-600/30 flex-shrink-0">
                <i className="fas fa-camera-retro text-base sm:text-lg"></i>
              </div>
              <div>
                <div className="flex items-center gap-2">
                  <h1 className="font-bold text-sm sm:text-base leading-none tracking-tight">Local Photo Gallery</h1>
                  {isDemoMode && (
                    <span className="text-[10px] bg-amber-500/20 text-amber-300 border border-amber-500/30 px-1.5 py-0.5 rounded font-medium">Demo</span>
                  )}
                </div>
                <p className="text-[11px] text-slate-400 mt-0.5 hidden xs:block">Offline-first local image browser</p>
              </div>
            </div>

            {/* Global Search Bar (Desktop) */}
            {activeTab === 'gallery' && (
              <div className="hidden md:flex flex-1 max-w-md mx-6">
                <div className="relative w-full">
                  <i className="fas fa-search absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                  <input
                    type="text"
                    placeholder="Search photos by filename, tag, or camera..."
                    value={searchQuery}
                    onChange={(e) => setSearchQuery(e.target.value)}
                    className="w-full bg-slate-950 border border-slate-800 rounded-lg pl-10 pr-4 py-2 text-sm focus:outline-none focus:border-indigo-500 text-slate-200 placeholder-slate-500 transition-colors"
                  />
                  {searchQuery && (
                    <button onClick={() => setSearchQuery('')} className="absolute right-3 top-1/2 -translate-y-1/2 text-slate-500 hover:text-slate-300">
                      <i className="fas fa-times text-xs"></i>
                    </button>
                  )}
                </div>
              </div>
            )}

            {/* Header Right Actions */}
            <div className="flex items-center gap-2">
              {activeTab === 'gallery' && (
                <>
                  {/* Mobile Tag Sidebar Toggle */}
                  <button
                    onClick={() => setIsMobileSidebarOpen(!isMobileSidebarOpen)}
                    className="md:hidden p-2 text-slate-400 hover:text-slate-200 bg-slate-800/60 rounded-lg border border-slate-700/60 text-sm"
                    title="Toggle Filter Drawer"
                  >
                    <i className="fas fa-filter"></i>
                  </button>

                  <div className="hidden sm:flex items-center gap-2 bg-slate-950 border border-slate-800 rounded-lg px-2.5 py-1 text-xs text-slate-400">
                    <span>Batch:</span>
                    <select
                      value={pageSize}
                      onChange={(e) => setPageSize(Number(e.target.value))}
                      className="bg-transparent text-indigo-400 font-medium focus:outline-none cursor-pointer"
                    >
                      <option value={60} className="bg-slate-900">60</option>
                      <option value={120} className="bg-slate-900">120</option>
                      <option value={250} className="bg-slate-900">250</option>
                      <option value={500} className="bg-slate-900">500</option>
                    </select>
                  </div>
                </>
              )}

              <button
                onClick={() => setActiveTab('gallery')}
                className={`px-3 py-1.5 sm:px-4 sm:py-2 rounded-lg text-xs sm:text-sm font-medium transition-colors flex items-center gap-1.5 ${
                  activeTab === 'gallery' ? 'bg-indigo-600 text-white' : 'text-slate-400 hover:text-slate-200 hover:bg-slate-800'
                }`}
              >
                <i className="fas fa-images"></i>
                <span className="hidden xs:inline">Gallery</span>
              </button>
              <button
                onClick={() => setActiveTab('settings')}
                className={`px-3 py-1.5 sm:px-4 sm:py-2 rounded-lg text-xs sm:text-sm font-medium transition-colors flex items-center gap-1.5 ${
                  activeTab === 'settings' ? 'bg-indigo-600 text-white' : 'text-slate-400 hover:text-slate-200 hover:bg-slate-800'
                }`}
              >
                <i className="fas fa-sliders-h"></i>
                <span className="hidden xs:inline">Settings</span>
              </button>
            </div>
          </header>

          {}
          <div className="flex-1 flex overflow-hidden relative">
            
            {/* GALLERY TAB */}
            {activeTab === 'gallery' && (
              <div className="flex-1 flex flex-col md:flex-row overflow-hidden w-full">
                
                {/* Mobile Search input bar */}
                <div className="p-3 border-b border-slate-800 md:hidden bg-slate-900/50">
                  <div className="relative w-full">
                    <i className="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
                    <input
                      type="text"
                      placeholder="Search photos or tags..."
                      value={searchQuery}
                      onChange={(e) => setSearchQuery(e.target.value)}
                      className="w-full bg-slate-950 border border-slate-800 rounded-lg pl-9 pr-8 py-1.5 text-xs text-slate-200 placeholder-slate-500"
                    />
                    {searchQuery && (
                      <button onClick={() => setSearchQuery('')} className="absolute right-3 top-1/2 -translate-y-1/2 text-slate-500">
                        <i className="fas fa-times text-xs"></i>
                      </button>
                    )}
                  </div>
                </div>

                {/* Sidebar Drawer Container */}
                <aside className={`
                  fixed md:relative inset-y-0 left-0 z-30 w-72 md:w-64 bg-slate-900/95 md:bg-slate-900/40 border-r border-slate-800 p-4 flex flex-col gap-4 overflow-y-auto flex-shrink-0 transition-transform duration-300 ease-in-out
                  ${isMobileSidebarOpen ? 'translate-x-0 shadow-2xl backdrop-blur-md' : '-translate-x-full md:translate-x-0'}
                `}>
                  <div className="flex items-center justify-between">
                    <h2 className="text-xs font-semibold text-slate-400 uppercase tracking-wider">Tags Filter</h2>
                    <div className="flex items-center gap-2">
                      {selectedTag && (
                        <button onClick={() => setSelectedTag('')} className="text-xs text-indigo-400 hover:underline">
                          Clear
                        </button>
                      )}
                      <button onClick={() => setIsMobileSidebarOpen(false)} className="md:hidden text-slate-400 p-1">
                        <i className="fas fa-times"></i>
                      </button>
                    </div>
                  </div>

                  <div className="space-y-1 flex-1">
                    <button
                      onClick={() => { setSelectedTag(''); setIsMobileSidebarOpen(false); }}
                      className={`w-full text-left px-3 py-2 rounded-lg text-sm flex items-center justify-between transition-colors ${
                        selectedTag === '' ? 'bg-slate-800 text-indigo-400 font-medium' : 'text-slate-300 hover:bg-slate-800/60'
                      }`}
                    >
                      <span>All Photos</span>
                      <span className="text-xs text-slate-500">{totalPhotosCount}</span>
                    </button>

                    {tags.map(tag => (
                      <button
                        key={tag.id}
                        onClick={() => { setSelectedTag(tag.name); setIsMobileSidebarOpen(false); }}
                        className={`w-full text-left px-3 py-2 rounded-lg text-sm flex items-center justify-between transition-colors ${
                          selectedTag === tag.name ? 'bg-slate-800 text-indigo-400 font-medium' : 'text-slate-300 hover:bg-slate-800/60'
                        }`}
                      >
                        <div className="flex items-center gap-2 truncate">
                          <i className="fas fa-tag text-xs text-slate-500"></i>
                          <span className="truncate">{tag.name}</span>
                        </div>
                        <span className="text-[10px] uppercase px-1.5 py-0.5 rounded bg-slate-800 text-slate-400 border border-slate-700">
                          {tag.category}
                        </span>
                      </button>
                    ))}
                  </div>

                  {/* Create New Tag Form */}
                  <form onSubmit={handleCreateTag} className="pt-4 border-t border-slate-800 space-y-2">
                    <h3 className="text-xs font-semibold text-slate-400 uppercase tracking-wider">New Tag</h3>
                    <input
                      type="text"
                      placeholder="Tag name..."
                      value={newTagName}
                      onChange={(e) => setNewTagName(e.target.value)}
                      className="w-full bg-slate-950 border border-slate-800 rounded px-2.5 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-indigo-500"
                    />
                    <select
                      value={newTagCategory}
                      onChange={(e) => setNewTagCategory(e.target.value)}
                      className="w-full bg-slate-950 border border-slate-800 rounded px-2.5 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-indigo-500"
                    >
                      <option value="general">General</option>
                      <option value="person">Person</option>
                      <option value="location">Location</option>
                      <option value="event">Event</option>
                    </select>
                    <button
                      type="submit"
                      className="w-full py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded text-xs font-medium transition-colors"
                    >
                      Add Tag
                    </button>
                  </form>
                </aside>

                {/* Mobile Drawer Overlay */}
                {isMobileSidebarOpen && (
                  <div 
                    onClick={() => setIsMobileSidebarOpen(false)} 
                    className="fixed inset-0 bg-slate-950/70 backdrop-blur-sm z-20 md:hidden"
                  />
                )}

                {/* Main Photo Grid View */}
                <main className="flex-1 p-3 sm:p-6 overflow-y-auto flex flex-col justify-between w-full">
                  {filteredPhotos.length === 0 && !isLoading ? (
                    <div className="h-full flex flex-col items-center justify-center text-center p-8 text-slate-500">
                      <i className="fas fa-folder-open text-5xl mb-4 text-slate-700"></i>
                      <h3 className="text-lg font-medium text-slate-400">No photos found</h3>
                      <p className="text-xs sm:text-sm mt-1 max-w-sm">
                        {totalPhotosCount === 0 
                          ? 'Go to "Settings" to configure your local photo directories.' 
                          : 'Try clearing your search query or tag filter.'}
                      </p>
                    </div>
                  ) : (
                    <div className="space-y-6">
                      
                      {/* Photo Grid */}
                      <div className="grid grid-cols-2 xs:grid-cols-3 sm:grid-cols-4 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-2 sm:gap-4">
                        {filteredPhotos.map((photo, index) => (
                          <div
                            key={photo.id || index}
                            onClick={() => setActivePhotoIndex(index)}
                            className="group relative aspect-square bg-slate-900 rounded-lg sm:rounded-xl overflow-hidden border border-slate-800 hover:border-indigo-500 cursor-pointer transition-all hover:scale-[1.02] shadow-md"
                          >
                            <img
                              src={getAssetUrl(photo.urls?.thumbnail || photo.urls?.original)}
                              alt={photo.file_name}
                              loading="lazy"
                              onError={(e) => {
                                if (photo.urls?.original && e.target.src !== getAssetUrl(photo.urls.original)) {
                                  e.target.src = getAssetUrl(photo.urls.original);
                                }
                              }}
                              className="w-full h-full object-cover group-hover:opacity-90 transition-opacity"
                            />
                            <div className="absolute inset-0 bg-gradient-to-t from-slate-950/90 via-transparent to-transparent opacity-0 group-hover:opacity-100 transition-opacity p-2 sm:p-2.5 flex flex-col justify-end">
                              <p className="text-[11px] sm:text-xs font-medium text-slate-200 truncate">{photo.file_name}</p>
                              <p className="text-[9px] sm:text-[10px] text-slate-400">
                                {photo.date_taken ? new Date(photo.date_taken).toLocaleDateString() : 'Unknown date'}
                              </p>
                            </div>
                          </div>
                        ))}
                      </div>

                      {/* Pagination Controls Footer */}
                      <div className="pt-6 border-t border-slate-800/80 flex flex-col sm:flex-row items-center justify-between gap-4">
                        <div className="text-xs text-slate-400 text-center sm:text-left">
                          Showing <span className="font-semibold text-slate-200">{filteredPhotos.length}</span> of <span className="font-semibold text-slate-200">{totalPhotosCount}</span> total indexed photos
                        </div>

                        <div className="flex flex-wrap items-center justify-center gap-3 w-full sm:w-auto">
                          {hasMore && (
                            <button
                              onClick={handleLoadMore}
                              disabled={isLoading}
                              className="flex-1 sm:flex-none px-5 py-2.5 bg-indigo-600 hover:bg-indigo-500 disabled:opacity-50 text-white rounded-lg text-xs sm:text-sm font-medium transition-colors flex items-center justify-center gap-2 shadow-lg shadow-indigo-600/20"
                            >
                              {isLoading ? (
                                <>
                                  <i className="fas fa-circle-notch fa-spin text-xs"></i>
                                  <span>Loading...</span>
                                </>
                              ) : (
                                <>
                                  <i className="fas fa-arrow-down text-xs"></i>
                                  <span>Load More Photos</span>
                                </>
                              )}
                            </button>
                          )}
                        </div>
                      </div>

                    </div>
                  )}
                </main>
              </div>
            )}

            {}
            {/* SETTINGS TAB */}
            {activeTab === 'settings' && (
              <main className="flex-1 p-4 sm:p-8 overflow-y-auto max-w-5xl mx-auto space-y-6 sm:space-y-8 w-full">
                
                {/* Server Network Address Config */}
                <section className="bg-slate-900 border border-slate-800 rounded-xl p-4 sm:p-6 space-y-4">
                  <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 border-b border-slate-800 pb-4">
                    <div className="flex items-center gap-3">
                      <i className="fas fa-network-wired text-indigo-400 text-lg sm:text-xl"></i>
                      <div>
                        <h2 className="text-sm sm:text-base font-semibold text-slate-200">Server Network Address</h2>
                        <p className="text-xs text-slate-400">Specify backend server URL (e.g. http://localhost:8080 or http://192.168.1.50:8080)</p>
                      </div>
                    </div>

                    {/* Server Status Indicators */}
                    <div className="flex flex-wrap items-center gap-2">
                      {/* Connection Status Badge */}
                      <div className={`px-3 py-1.5 rounded-full text-xs font-semibold flex items-center gap-2 border ${
                        isServerOnline 
                          ? 'bg-emerald-950/60 border-emerald-800/80 text-emerald-300' 
                          : 'bg-rose-950/60 border-rose-800/80 text-rose-300'
                      }`}>
                        <span className={`w-2 h-2 rounded-full ${isServerOnline ? 'bg-emerald-400 animate-pulse' : 'bg-rose-500'}`}></span>
                        <span>{isServerOnline ? (isDemoMode ? 'ONLINE (Demo)' : 'ONLINE') : 'OFFLINE'}</span>
                      </div>

                      {/* Server Activity State Badge derived from is_scanning & client cache state */}
                      <div className={`px-3 py-1.5 rounded-full text-xs font-semibold flex items-center gap-2 border ${
                        currentActivity === 'SCANNING' ? 'bg-amber-950/60 border-amber-800/80 text-amber-300' :
                        currentActivity === 'CACHING' ? 'bg-indigo-950/60 border-indigo-800/80 text-indigo-300' :
                        'bg-slate-800 border-slate-700 text-slate-300'
                      }`}>
                        <i className={`fas ${
                          currentActivity === 'SCANNING' ? 'fa-spinner fa-spin text-amber-400' :
                          currentActivity === 'CACHING' ? 'fa-sync fa-spin text-indigo-400' :
                          'fa-check-circle text-emerald-400'
                        } text-xs`}></i>
                        <span>Activity: {currentActivity}</span>
                      </div>
                    </div>
                  </div>

                  <div className="flex flex-col sm:flex-row gap-3">
                    <input
                      type="text"
                      value={serverUrl}
                      onChange={(e) => setServerUrl(e.target.value)}
                      placeholder="http://localhost:8080"
                      className="flex-1 bg-slate-950 border border-slate-800 rounded-lg px-4 py-2 text-sm text-slate-200 focus:outline-none focus:border-indigo-500"
                    />
                    <button
                      onClick={() => { fetchStatus(); fetchPhotos(1, false, pageSize); notify('Tested server connection!'); }}
                      className="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg text-sm font-medium transition-colors"
                    >
                      Test Connection
                    </button>
                  </div>
                </section>

                {/* System Status Dashboard Cards */}
                <section className="grid grid-cols-2 md:grid-cols-4 gap-3 sm:gap-4">
                  <div className="bg-slate-900 border border-slate-800 rounded-xl p-4 sm:p-5">
                    <p className="text-xs text-slate-400 font-medium">Indexed Photos</p>
                    <p className="text-xl sm:text-2xl font-bold text-slate-100 mt-1 sm:mt-2">{status?.total_photos ?? 0}</p>
                  </div>
                  <div className="bg-slate-900 border border-slate-800 rounded-xl p-4 sm:p-5">
                    <p className="text-xs text-slate-400 font-medium">Registered Tags</p>
                    <p className="text-xl sm:text-2xl font-bold text-slate-100 mt-1 sm:mt-2">{status?.total_tags ?? 0}</p>
                  </div>
                  <div className="bg-slate-900 border border-slate-800 rounded-xl p-4 sm:p-5">
                    <p className="text-xs text-slate-400 font-medium">Database Size</p>
                    <p className="text-xl sm:text-2xl font-bold text-slate-100 mt-1 sm:mt-2">
                      {status?.db_size_bytes ? (status.db_size_bytes / (1024 * 1024)).toFixed(2) + ' MB' : '0 MB'}
                    </p>
                  </div>
                  <div className="bg-slate-900 border border-slate-800 rounded-xl p-4 sm:p-5">
                    <p className="text-xs text-slate-400 font-medium">Thumbnail Cache</p>
                    <p className="text-xl sm:text-2xl font-bold text-slate-100 mt-1 sm:mt-2">
                      {status?.cache_size_bytes ? (status.cache_size_bytes / (1024 * 1024)).toFixed(2) + ' MB' : '0 MB'}
                    </p>
                  </div>
                </section>

                {/* Monitored Directories */}
                <section className="bg-slate-900 border border-slate-800 rounded-xl p-4 sm:p-6 space-y-4">
                  <h2 className="text-sm sm:text-base font-semibold text-slate-200">Monitored Photo Directories</h2>
                  
                  <form onSubmit={handleAddDirectory} className="flex flex-col sm:flex-row gap-3">
                    <input
                      type="text"
                      placeholder="e.g. C:\Users\Username\Pictures or D:\Photos"
                      value={newDirectoryPath}
                      onChange={(e) => setNewDirectoryPath(e.target.value)}
                      className="flex-1 bg-slate-950 border border-slate-800 rounded-lg px-4 py-2 text-sm text-slate-200 focus:outline-none focus:border-indigo-500"
                    />
                    <button
                      type="submit"
                      className="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg text-sm font-medium transition-colors flex items-center justify-center gap-2"
                    >
                      <i className="fas fa-plus text-xs"></i>
                      <span>Add Directory</span>
                    </button>
                  </form>

                  <div className="space-y-2 pt-2">
                    {status?.monitored_dirs?.length === 0 ? (
                      <p className="text-sm text-slate-500 italic">No directories added yet.</p>
                    ) : (
                      status?.monitored_dirs?.map((dir, idx) => (
                        <div key={idx} className="flex items-center justify-between bg-slate-950 border border-slate-800 px-3 py-2.5 sm:px-4 sm:py-3 rounded-lg gap-2">
                          <span className="text-xs sm:text-sm font-mono text-slate-300 truncate">{dir}</span>
                          <button
                            onClick={() => handleRemoveDirectory(dir)}
                            className="text-xs text-rose-400 hover:text-rose-300 font-medium px-2 py-1 rounded hover:bg-rose-950/50 transition-colors flex-shrink-0"
                          >
                            Remove
                          </button>
                        </div>
                      ))
                    )}
                  </div>
                </section>

                {/* Maintenance Operations */}
                <section className="bg-slate-900 border border-slate-800 rounded-xl p-4 sm:p-6 space-y-4">
                  <h2 className="text-sm sm:text-base font-semibold text-slate-200">Maintenance & Synchronization</h2>
                  <div className="flex flex-wrap gap-3">
                    <button
                      onClick={handleTriggerScan}
                      className="flex-1 sm:flex-none px-4 py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-lg text-xs sm:text-sm font-medium transition-colors flex items-center justify-center gap-2 border border-slate-700"
                    >
                      <i className="fas fa-sync-alt text-indigo-400"></i>
                      <span>Rescan Directories</span>
                    </button>
                    <button
                      onClick={handlePurgeCache}
                      className="flex-1 sm:flex-none px-4 py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-lg text-xs sm:text-sm font-medium transition-colors flex items-center justify-center gap-2 border border-slate-700"
                    >
                      <i className="fas fa-broom text-amber-400"></i>
                      <span>Purge Thumbnail Cache</span>
                    </button>
                  </div>
                </section>

              </main>
            )}

          </div>

          {}
          {/* LIGHTBOX MODAL */}
          {activePhotoIndex !== null && filteredPhotos[activePhotoIndex] && (
            <div className="fixed inset-0 z-50 bg-slate-950/95 backdrop-blur-md flex flex-col md:flex-row overflow-hidden">
              
              {/* Close Button */}
              <button
                onClick={() => setActivePhotoIndex(null)}
                className="absolute top-3 right-3 z-50 w-10 h-10 rounded-full bg-slate-900/80 border border-slate-700 text-slate-300 hover:text-white hover:bg-slate-800 flex items-center justify-center transition-colors shadow-lg"
                title="Close Viewer (Esc)"
              >
                <i className="fas fa-times text-base"></i>
              </button>

              {/* Mobile View Toggle Tabs (Preview vs Details) */}
              <div className="md:hidden flex border-b border-slate-800 bg-slate-900 text-xs">
                <button
                  onClick={() => setMobileTab('preview')}
                  className={`flex-1 py-2.5 font-medium border-b-2 transition-colors ${
                    mobileTab === 'preview' ? 'border-indigo-500 text-indigo-400 bg-slate-950/50' : 'border-transparent text-slate-400'
                  }`}
                >
                  <i className="fas fa-image mr-2"></i>Photo
                </button>
                <button
                  onClick={() => setMobileTab('info')}
                  className={`flex-1 py-2.5 font-medium border-b-2 transition-colors ${
                    mobileTab === 'info' ? 'border-indigo-500 text-indigo-400 bg-slate-950/50' : 'border-transparent text-slate-400'
                  }`}
                >
                  <i className="fas fa-info-circle mr-2"></i>Metadata & Tags
                </button>
              </div>

              {/* Main Image Viewport with Next/Prev Overlay */}
              <div 
                className={`flex-1 relative flex items-center justify-center p-4 sm:p-8 select-none touch-action-none ${
                  mobileTab === 'preview' ? 'flex' : 'hidden md:flex'
                }`}
                onTouchStart={handleTouchStart}
                onTouchMove={handleTouchMove}
                onTouchEnd={handleTouchEnd}
              >
                {/* Prev Button */}
                {activePhotoIndex > 0 && (
                  <button
                    onClick={() => setActivePhotoIndex(activePhotoIndex - 1)}
                    className="absolute left-2 sm:left-6 top-1/2 -translate-y-1/2 z-40 w-10 h-10 sm:w-12 sm:h-12 rounded-full bg-slate-900/80 border border-slate-700 text-slate-300 hover:text-white hover:bg-slate-800 flex items-center justify-center transition-all shadow-xl hover:scale-110"
                    title="Previous Photo (Left Arrow)"
                  >
                    <i className="fas fa-chevron-left text-base sm:text-lg"></i>
                  </button>
                )}

                {/* Photo Element */}
                <div className="relative max-h-full max-w-full flex items-center justify-center">
                  <img
                    src={getAssetUrl(filteredPhotos[activePhotoIndex].urls?.original || filteredPhotos[activePhotoIndex].urls?.thumbnail)}
                    alt={filteredPhotos[activePhotoIndex].file_name}
                    className="max-h-[80vh] md:max-h-[90vh] max-w-full object-contain rounded-lg shadow-2xl transition-all"
                    onError={(e) => {
                      if (filteredPhotos[activePhotoIndex]?.urls?.thumbnail) {
                        e.target.src = getAssetUrl(filteredPhotos[activePhotoIndex].urls.thumbnail);
                      }
                    }}
                  />
                </div>

                {/* Next Button */}
                {activePhotoIndex < filteredPhotos.length - 1 && (
                  <button
                    onClick={() => setActivePhotoIndex(activePhotoIndex + 1)}
                    className="absolute right-2 sm:right-6 top-1/2 -translate-y-1/2 z-40 w-10 h-10 sm:w-12 sm:h-12 rounded-full bg-slate-900/80 border border-slate-700 text-slate-300 hover:text-white hover:bg-slate-800 flex items-center justify-center transition-all shadow-xl hover:scale-110"
                    title="Next Photo (Right Arrow)"
                  >
                    <i className="fas fa-chevron-right text-base sm:text-lg"></i>
                  </button>
                )}
              </div>

              {/* Photo Details Sidebar */}
              <aside className={`
                w-full md:w-80 border-t md:border-t-0 md:border-l border-slate-800 bg-slate-900 p-5 sm:p-6 flex-col gap-5 overflow-y-auto flex-shrink-0 z-40
                ${mobileTab === 'info' ? 'flex' : 'hidden md:flex'}
              `}>
                <div>
                  <h3 className="font-semibold text-slate-100 text-sm sm:text-base break-words">
                    {filteredPhotos[activePhotoIndex].file_name}
                  </h3>
                  <p className="text-xs text-slate-400 mt-1">
                    {filteredPhotos[activePhotoIndex].date_taken 
                      ? new Date(filteredPhotos[activePhotoIndex].date_taken).toLocaleString() 
                      : 'Unknown date'}
                  </p>
                </div>

                {/* Exif Metadata Grid */}
                <div className="space-y-3 pt-3 border-t border-slate-800 text-xs">
                  <h4 className="font-semibold text-slate-400 uppercase tracking-wider text-[10px]">Photo Info</h4>
                  <div className="flex justify-between py-1 border-b border-slate-800/60">
                    <span className="text-slate-500">Dimensions</span>
                    <span className="text-slate-300 font-mono">
                      {filteredPhotos[activePhotoIndex].width} × {filteredPhotos[activePhotoIndex].height}
                    </span>
                  </div>
                  <div className="flex justify-between py-1 border-b border-slate-800/60">
                    <span className="text-slate-500">File Size</span>
                    <span className="text-slate-300 font-mono">
                      {(filteredPhotos[activePhotoIndex].file_size / (1024 * 1024)).toFixed(2)} MB
                    </span>
                  </div>
                  {filteredPhotos[activePhotoIndex].camera_make && (
                    <div className="flex justify-between py-1 border-b border-slate-800/60">
                      <span className="text-slate-500">Camera</span>
                      <span className="text-slate-300 truncate max-w-[140px]">
                        {filteredPhotos[activePhotoIndex].camera_make} {filteredPhotos[activePhotoIndex].camera_model}
                      </span>
                    </div>
                  )}
                  <div className="py-1">
                    <span className="text-slate-500 block mb-1">File Path</span>
                    <span className="text-slate-400 font-mono text-[10px] break-all block bg-slate-950 p-2 rounded border border-slate-800">
                      {filteredPhotos[activePhotoIndex].file_path}
                    </span>
                  </div>
                </div>

                {/* Attached Tags Section */}
                <div className="space-y-3 pt-3 border-t border-slate-800">
                  <h4 className="font-semibold text-slate-400 uppercase tracking-wider text-[10px]">Attached Tags</h4>
                  <div className="flex flex-wrap gap-1.5">
                    {filteredPhotos[activePhotoIndex].tags?.map(t => (
                      <span key={t.id} className="inline-flex items-center gap-1.5 bg-slate-800 text-indigo-300 text-xs px-2.5 py-1 rounded-full border border-slate-700">
                        <span>{t.name}</span>
                        <button
                          onClick={() => handleDetachTagFromPhoto(filteredPhotos[activePhotoIndex].id, t.id)}
                          className="hover:text-rose-400 transition-colors"
                        >
                          <i className="fas fa-times text-[10px]"></i>
                        </button>
                      </span>
                    ))}
                  </div>

                  {/* Attach Available Tags */}
                  <div className="pt-2">
                    <label className="text-[10px] uppercase font-semibold text-slate-500 block mb-1.5">Attach Tag</label>
                    <select
                      onChange={(e) => {
                        if (e.target.value) {
                          handleAttachTagToPhoto(filteredPhotos[activePhotoIndex].id, parseInt(e.target.value));
                          e.target.value = '';
                        }
                      }}
                      className="w-full bg-slate-950 border border-slate-800 rounded px-2.5 py-1.5 text-xs text-slate-300 focus:outline-none focus:border-indigo-500"
                    >
                      <option value="">+ Select tag to attach...</option>
                      {tags.map(t => (
                        <option key={t.id} value={t.id}>{t.name} ({t.category})</option>
                      ))}
                    </select>
                  </div>
                </div>

              </aside>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
